name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      # Squash merges use the PR title as the commit message, so lint the title.
      # Keep `scopes` in sync with commitlint.config.js
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          scopes: |
            api
            get
            cli
            deps
            ci
            release
            repo

      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: github.event_name == 'push'
        with:
          node-version: '22.20'

      - name: Install
        if: github.event_name == 'push'
        run: yarn install --immutable

      # Fails after the fact: it cannot block a direct push, only make the violation visible
      - name: Lint pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # first push of a branch, or force push over history we no longer have
            yarn commitlint --last
          else
            yarn commitlint --from "$BEFORE" --to "$AFTER"
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.20'

      - name: Install
        run: yarn install --immutable

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('yarn.lock') }}-

      - name: Build
        run: yarn turbo run build
