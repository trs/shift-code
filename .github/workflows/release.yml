name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write

# A run's tags must exist before the next run's release-please reads them
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      cli_release_created: ${{ steps.rp.outputs['cli--release_created'] }}
      cli_tag_name: ${{ steps.rp.outputs['cli--tag_name'] }}
    steps:
      # A PAT or GitHub App token, not GITHUB_TOKEN, so CI runs on the release PR
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Libraries skip GitHub Releases, so release-please outputs never signal them.
  # A version missing from npm always means a pending release.
  publish-libs:
    needs: release-please
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [api, get]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm
        id: check
        run: |
          NAME="$(node -p "require('./${{ matrix.package }}/package.json').name")"
          VERSION="$(node -p "require('./${{ matrix.package }}/package.json').version")"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.check.outputs.published == 'false'
        run: yarn install --immutable

      - name: Build
        if: steps.check.outputs.published == 'false'
        run: yarn turbo run build --filter=${{ steps.check.outputs.name }}

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: yarn workspace ${{ steps.check.outputs.name }} npm publish

      - name: Tag
        if: steps.check.outputs.published == 'false'
        env:
          TAG: ${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }}
        run: |
          if [ -z "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

  # Must run after publish-libs: the published cli manifest references the new library versions
  publish-cli:
    needs: [release-please, publish-libs]
    if: always() && needs.release-please.outputs.cli_release_created == 'true' && needs.publish-libs.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: yarn install --immutable

      - name: Build
        run: yarn turbo run build --filter=@shift-code/cli

      - name: Publish
        run: |
          VERSION="$(node -p "require('./cli/package.json').version")"
          if [ "$(npm view "@shift-code/cli@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "@shift-code/cli@$VERSION already published"
          else
            yarn workspace @shift-code/cli npm publish
          fi

      - name: Package
        run: |
          yarn turbo run pkg --filter=@shift-code/cli
          for file in cli/pkg/cli-*; do
            mv "$file" "$(echo "$file" | sed -e 's#cli-#shift-code-#')"
          done

      - name: Upload binaries
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ needs.release-please.outputs.cli_tag_name }}
        run: gh release upload "$TAG" cli/pkg/* --clobber
